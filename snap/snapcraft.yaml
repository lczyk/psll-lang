name: psll
base: core24
adopt-info: psll
title: psll -- Pyramid Scheme compiler
summary: Compiler for the Pyramid Scheme esoteric language
description: |
  [Pyramid Scheme](https://github.com/ConorOBrien-Foxx/Pyramid-Scheme) is an
  esoteric language whose programs are ascii-art pyramids. psll lets you write
  them in a lisp-like syntax instead, with macros, strings, `def` and
  code-golf optimisations, and compiles that to the pyramids for you.

  For example, this psll program

      (set a 6) (set b 7)
      (out (* a b))

  compiles to

          ^        ^          ^
         / \      / \        / \
        /set\    /set\      /out\
       ^-----^  ^-----^    ^-----
      /a\   /6\/b\   /7\  /*\
      ---   ------   --- ^---^
                        /a\ /b\
                        --- ---

  and prints `42`.

  Commands:

  * `psll compile prog.psll` -- compile to a .pyra file
  * `psll run prog.pyra` -- run a Pyramid Scheme program
  * `psll compile-and-run prog.psll` -- both in one go

  Ruby and the Pyramid Scheme interpreter are bundled, so everything works
  offline out of the box.

  Read more in [the SIGBOVIK paper](https://github.com/lczyk/psll-lang/blob/master/sigbovik-paper/sigbovik-psll.pdf).
license: MIT
grade: stable
confinement: strict
website:
  - https://github.com/lczyk/psll-lang
  #
source-code:
  - https://github.com/lczyk/psll-lang
  #
issues:
  - https://github.com/lczyk/psll-lang/issues
  #
contact:
  - https://github.com/lczyk/psll-lang/issues
  #

apps:
  psll:
    command: bin/psll
    # debian's ruby has its lib paths compiled in as /usr/lib/ruby, which is
    # the base snap here. pyra.rb needs no gems, so skip loading them.
    environment:
      RUBYLIB: $SNAP/usr/lib/ruby/vendor_ruby:$SNAP/usr/lib/ruby/3.2.0:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ruby/3.2.0
      RUBYOPT: --disable-gems
    plugs:
      - home

parts:
  psll:
    plugin: python
    source: .
    # keep the snap version in sync with psll/__init__.py
    override-pull: |
      craftctl default
      craftctl set version="$(grep -oP '__version__\s*=\s*"\K[^"]+' psll/__init__.py)"
    # pyra.rb is pure ruby stdlib (no gems), so bare ruby is enough
    stage-packages:
      - ruby
      #

  # drop the bundled interpreter at $SNAP/pyra.rb where _snap_path() finds it.
  # same pinned commit as PYRA_RB_URL in psll/__main__.py
  pyra:
    plugin: dump
    source: https://raw.githubusercontent.com/ConorOBrien-Foxx/Pyramid-Scheme/fd183d296f08e0cba8bf55da907697eaf412f6a7/pyra.rb
    source-type: file
    source-checksum: sha256/d19de824c38c4bd791a94ad7c5b8ccc9c3dee0d82cb9de1e92edcf3fa4724dd5
    stage:
      - pyra.rb
      #
