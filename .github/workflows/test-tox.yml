name: test-tox

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}  

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    timeout-minutes: 10 # windows is slow

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: 2.6

      # uv fetches every interpreter tox asks for, including ones setup-python
      # no longer ships for the runner (3.9 on ubuntu 26.04)
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run tox
        run: uvx --with tox-uv tox
