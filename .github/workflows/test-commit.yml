name: test-commit

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Pyramid-Scheme
        run: git submodule update --init # --recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: 2.6

      - name: Set up uv with Python 3.9
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.9'
          activate-environment: true

      - name: Install
        run: uv sync

      - name: Check with ruff
        run: uv run ruff format --check .

      - name: Check with mypy
        run: uv run mypy

      - name: Run tests and coverage
        run: bash test.sh -e -c

      - name: Push to coveralls
        run: uv run --with coveralls coveralls debug --service=github

      # Performance check

      - name: Run performance check
        run: python ./perf/perf_ascii_trees.py result.perf && cat result.perf

      - name: Checkout psll-perf branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: psll-perf
          path: temp-perf

      - name: Append performance data
        run: |
          cd ./temp-perf
          cat ../result.perf | tail -n +2 | awk -v sha=$GITHUB_SHA '{ f = "./data/" $1 ".data"; $1 = sha; print >> f }'

      - name: Push to psll-perf
        run: |
          cd ./temp-perf
          git status
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -a -m "Automated report"
          git push