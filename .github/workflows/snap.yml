name: snap

# build and smoke-test the snap on every push and PR. pushes to master also
# upload to the edge channel. promotion past edge is done by hand.

on:
  push:
    branches:
      - master
      #
    paths-ignore:
      - '**/*.md'
      #
  pull_request:
    paths-ignore:
      - '**/*.md'
      #
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
          #
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snapcraft
        with:
          snapcraft-args: pack --output psll_${{ matrix.runner.arch }}.snap

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psll_${{ matrix.runner.arch }}.snap
          path: ${{ steps.snapcraft.outputs.snap }}

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: amd64
            os: ubuntu-24.04
          - arch: amd64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-24.04-arm
          - arch: arm64
            os: ubuntu-22.04-arm
          #
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psll_${{ matrix.runner.arch }}.snap

      - name: Install snap
        run: sudo snap install --dangerous psll_${{ matrix.runner.arch }}.snap

      - name: Run examples
        run: sh tests/snap-smoke.sh
        env:
          PSLL: /snap/bin/psll

  publish:
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          #
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psll_${{ matrix.arch }}.snap

      - name: Upload to edge
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: psll_${{ matrix.arch }}.snap
          release: edge
