[tox]
min_version = 4.0
env_list =
    py315t
    py315
    py314t
    py314
    py313t
    py313
    py312
    py311
    py310
    py39
    format

[testenv]
dependency_groups = dev
package = wheel
commands =
    psll download-pyra --here --force
    pytest
    mypy

; mypy does not install (3.13t) or crashes (3.14t) on free-threaded builds,
; so these only run the tests
[testenv:py3{13,14,15}t]
dependency_groups = test
commands =
    psll download-pyra --here --force
    pytest

[testenv:format]
dependency_groups = dev
package = wheel
commands =
    ruff format --check ./psll
